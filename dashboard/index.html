<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>QA Automation Dashboard</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
    }

    h1 {
      text-align: center;
    }

    .chart {
      margin-bottom: 50px;
    }

    img {
      max-width: 100%;
      border: 1px solid #ddd;
    }
  </style>
</head>

<body>

<h1>QA Automation Dashboard</h1>

<h2>Pass Rate Trend</h2>

<div class="chart">
  <img
    src="pass-rate.png"
    alt="Pass Rate Trend">
</div>

<h2>Failure Trend</h2>

<div class="chart">
  <img
    src="failure-trend.png"
    alt="Fail Rate Trend">
</div>

<h2>Duration Trend</h2>

<div class="chart">
  <img
    src="duration-trend.png.png"
    alt="Duration Rate Trend">
</div>

</body>
</html>
