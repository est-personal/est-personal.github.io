<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>QA Automation Dashboard</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
    }

    h1 {
      text-align: center;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
      margin: 20px 0 40px;
    }
    
    .card {
      background: #f5f5f5;
      border-radius: 10px;
      padding: 20px;
      text-align: center;
      border: 1px solid #ddd;
    }
    
    .card-title {
      font-size: 14px;
      color: #666;
    }
    
    .card-value {
      font-size: 32px;
      font-weight: bold;
      margin-top: 10px;
    }

    .pass-rate {
      color: #16a34a;
    }
    
    .failed {
      color: #dc2626;
    }
    
    .flaky {
      color: #f59e0b;
    }

    #last-run {
      font-size: 20px;
    }

    #browser {
      font-size: 20px;
    }

    #header-stats {
      text-align: center;
      margin-bottom: 20px;
      color: #666;
    }

    .chart {
      margin-bottom: 50px;
    }

    img {
      max-width: 100%;
      border: 1px solid #ddd;
    }
  </style>
</head>

<body>

<h1>QA Automation Dashboard - Playwright JavaScript</h1>

<div id="header-stats"></div>

<p>
  <a 
    href="https://est-personal.github.io/allure-report/" 
    target="_blank">
    📊 Open Allure Report
  </a>
</p>

<div class="cards">

  <div class="card">
    <div class="card-title">Total Tests</div>
    <div class="card-value" id="total-tests">-</div>
  </div>

  <div class="card">
    <div class="card-title">Tests Added</div>
    <div class="card-value" id="tests-added">-</div>
  </div>

  <div class="card">
    <div class="card-title">Pass Rate</div>
    <div class="card-value pass-rate" id="pass-rate">-</div>
  </div>

  <div class="card">
    <div class="card-title">Failed</div>
    <div class="card-value failed" id="failed">-</div>
  </div>

  <div class="card">
    <div class="card-title">Failure Rate</div>
    <div class="card-value failed" id="failure-rate">-</div>
  </div>

  <div class="card">
    <div class="card-title">Flaky</div>
    <div class="card-value flaky" id="flaky">-</div>
  </div>

  <div class="card">
    <div class="card-title">Duration</div>
    <div class="card-value" id="duration">-</div>
  </div>

  <div class="card">
    <div class="card-title">Avg Duration</div>
    <div class="card-value" id="avg-duration"></div>
  </div>
  
  <div class="card">
    <div class="card-title">Execution</div>
    <div class="card-value" id="runs">-</div>
  </div>

  <div class="card">
    <div class="card-title">Browser</div>
    <div class="card-value" id="browser">-</div>
  </div>

  <div class="card">
    <div class="card-title">Last Run</div>
    <div class="card-value" id="last-run">-</div>
  </div>

</div>

<h2>Pass Rate Trend</h2>

<div class="chart">
  <img
    src="pass-rate.png"
    alt="Pass Rate Trend">
</div>

<h2>Failure Trend</h2>

<div class="chart">
  <img
    src="failure-trend.png"
    alt="Fail Rate Trend">
</div>

<h2>Duration Trend</h2>

<div class="chart">
  <img
    src="duration-trend.png"
    alt="Duration Rate Trend">
</div>

<h2>Test Count Trend</h2>

<div class="chart">
  <img
    src="test-count-trend.png"
    alt="Test Count Trend">
</div>

<script>
async function loadMetrics() {

  try {

    const response =
      await fetch('history.json');

    const history =
      await response.json();

    const latest =
      history[history.length - 1];

    const avgDurationSeconds =
      history.reduce(
        (sum, h) =>
          sum + (h.durationSeconds || 0),
        0
      ) / history.length;

    const previous =
      history.length > 1
        ? history[history.length - 2]
        : null;

    const totalDelta =
      previous
        ? Math.max(
            latest.total - previous.total,
            0
          )
        : 0;

    const failureRate =
      latest.total === 0
        ? 0
        : (
            latest.failed /
            latest.total
          ) * 100;

    const passTrend =
      previous &&
      latest.passRate >
      previous.passRate
        ? '▲'
        : previous &&
          latest.passRate <
          previous.passRate
        ? '▼'
        : '■';

    const avgMinutes =
      Math.floor(
        avgDurationSeconds / 60
      );
    
    const avgSeconds =
      Math.round(
        avgDurationSeconds % 60
      );
        
    document.getElementById(
      'header-stats'
    ).innerHTML =
    `
    <b>Last Updated:</b> ${latest.date}
    &nbsp; | &nbsp;
    <b>Framework:</b> Playwright
    &nbsp; | &nbsp;
    <b>Browser:</b> ${latest.browser || 'chromium'}
    &nbsp; | &nbsp;
    <b>Executions:</b> ${history.length}
    `;

    document.getElementById(
      'total-tests'
    ).textContent =
      latest.total;

    document.getElementById(
      'tests-added'
    ).textContent =
      totalDelta >= 1
        ? `+${totalDelta}`
        : '-';

    document.getElementById(
      'pass-rate'
    ).textContent =
      `${latest.passRate}% ${passTrend}`;

    document.getElementById(
      'failed'
    ).textContent =
      latest.failed;

    document.getElementById(
      'failure-rate'
    ).textContent =
      `${failureRate.toFixed(2)}%`;

    document.getElementById(
      'flaky'
    ).textContent =
      latest.flaky;

    document.getElementById(
      'duration'
    ).textContent =
      latest.duration
        ? latest.duration
        : latest.durationSeconds
          ? `${Math.round(
              latest.durationSeconds / 60
            )}m`
          : '-';

    document.getElementById(
      'avg-duration'
    ).textContent =
      `${avgMinutes}m ${avgSeconds}s`;

    document.getElementById(
      'runs'
    ).textContent =
      history.length;

    document.getElementById(
      'browser'
    ).textContent =
      latest.browser || 'chromium';

    document.getElementById(
      'last-run'
    ).textContent =
      latest.date;

  } catch (error) {

    console.error(
      'Unable to load history.json',
      error
    );

  }

}

loadMetrics();
</script>

</body>
</html>
